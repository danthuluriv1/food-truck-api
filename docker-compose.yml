services:
  api:
    build:
      context: https://github.com/danthuluriv1/food-truck-api.git#feature/init:food-truck-api
    container_name: food-truck-api-container-feature-init
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: development
      ASPNETCORE_URLS: http://+:8080
      AppSettings__ConnectionStrings__AppDbConnectionString: mongodb://appuser:Rajubabu%40139@host.docker.internal:27017/appdb?authSource=appdb
      AppSettings__ConnectionStrings__AppDbDatabaseName: appdb
    restart: unless-stopped